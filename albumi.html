<html lang="sr">
<head>

</head>
<body>

<script src="script.js"></script>

<header>
    <h1>POZNATI ALBUMI</h1>

    <nav>
        <a href="index.html">Početna</a>
        <a href="bendovi.html">Bendovi</a>
        <a href="albumi.html">Albumi</a>
        <a href="galerija.html">Galerija</a>

    </nav>
</header>

<main>

    <div class="kartica">
        <h2>Oceni album</h2>

        <input type="number" id="ocena" placeholder="Unesi ocenu 1-10">

        <button onclick="oceniAlbum()">
            Proveri
        </button>

        <div id="albumRezultat"></div>
    </div>

    <div class="kartica">
        <h2>Dodaj album</h2>

        <input type="text" id="noviAlbum" placeholder="Naziv albuma">

        <button onclick="dodajAlbum()">
            Dodaj album
        </button>

        <ul id="lista" class="listaAlbuma"></ul>
    </div>

</main>


</body>
</html>
